<svg xmlns="http://www.w3.org/2000/svg" width="687" height="782" viewBox="0 0 687 782" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Claude Code session running jarmak-personal-smi, an nvidia-smi style readout of my current projects">
<style>
text { font-size: 12px; fill: #d0d3da; }
.dim { fill: #5b5f6b; } .muted { fill: #9aa0ac; } .bright { fill: #eceef2; }
.orange { fill: #d97757; } .green { fill: #76b900; } .link { fill: #79c0ff; text-decoration: underline; }
.fade { opacity: 0; animation: appear 0.01s linear var(--t) forwards; }
.type { clip-path: inset(0 100% 0 0); animation: typing var(--d) steps(var(--n)) var(--t) forwards; }
.cursor { fill: #d97757; animation: blink 1.1s step-end var(--t) infinite; }
@keyframes appear { to { opacity: 1; } }
@keyframes typing { to { clip-path: inset(0 -2% 0 0); } }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .fade, .type, .cursor { animation: none; opacity: 1; clip-path: none; }
}
</style>
